[project]
name = "credit-risk-ml-platform"
version = "0.2.0"
description = "End-to-end credit risk (probability of default) platform: MLflow lifecycle, FastAPI scoring service and Streamlit dashboard"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Reorapetse Molefe" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "mlflow>=3.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "optuna>=4.0",
    "shap>=0.46",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "streamlit>=1.40",
    "plotly>=5.24",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
extend-exclude = ["notebooks", "artifacts", "mlartifacts", "mlruns", "backups"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
