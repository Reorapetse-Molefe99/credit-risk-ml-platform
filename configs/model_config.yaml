# Central configuration for the credit-risk platform. Paths are relative to the project root.
data:
  raw_path: data/raw/HomeLoanData.csv
  processed_dir: data/processed
  reference_dir: data/reference
  id_col: SK_ID_CURR
  target: TARGET              # 1 = client defaulted / had payment difficulties
  test_size: 0.20             # final hold-out – never used for tuning
  val_size: 0.20              # share of the remaining data used for validation / tuning
  random_state: 42
  reference_sample_size: 20000
  # Protected attributes are excluded from modelling (unfair-discrimination rules in credit regulation).
  exclude_features:
    - CODE_GENDER

model:
  default_algorithm: lightgbm
  params:
    logreg:   {C: 0.1, max_iter: 2000, class_weight: null}
    hgb:      {max_iter: 400, learning_rate: 0.05, max_leaf_nodes: 31, l2_regularization: 1.0,
               early_stopping: true, random_state: 42}
    xgboost:  {n_estimators: 600, learning_rate: 0.05, max_depth: 5, min_child_weight: 5, subsample: 0.8,
               colsample_bytree: 0.7, reg_lambda: 1.0, tree_method: hist, eval_metric: auc, n_jobs: -1,
               random_state: 42}
    lightgbm: {n_estimators: 800, learning_rate: 0.03, num_leaves: 31, min_child_samples: 50, subsample: 0.8,
               subsample_freq: 1, colsample_bytree: 0.7, reg_lambda: 1.0, n_jobs: -1, random_state: 42,
               verbose: -1}

mlflow:
  # Override with the MLFLOW_TRACKING_URI environment variable.
  tracking_uri: http://127.0.0.1:5000
  experiment_name: credit-risk-pd
  registered_model_name: credit-risk-pd

promotion:
  primary_metric: roc_auc     # compared on the test split
  min_improvement: 0.002      # challenger must beat champion by at least this much
  max_psi: 0.25               # warn if challenger scores shift more than this vs champion

artifacts:
  model_dir: artifacts/model          # exported @champion, used by the API / Docker image
  metrics_path: artifacts/metrics.json

risk_grades:                  # upper PD bound per grade
  A: 0.02
  B: 0.05
  C: 0.10
  D: 0.20
  E: 1.00

decision:
  approve_below: 0.10         # PD < 0.10 -> approve
  decline_above: 0.20         # PD >= 0.20 -> decline; in between -> refer to underwriter

strategy:                     # defaults for the dashboard strategy simulator
  lgd: 0.45                   # loss given default
  annual_margin: 0.12         # net interest margin earned on performing loans
  term_years: 1.0

monitoring:
  psi_warning: 0.10
  psi_alert: 0.25
  top_features: 20
